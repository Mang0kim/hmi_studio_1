<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인터랙티브 웹 페이지 샘플</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s ease;
            font-family: sans-serif;
        }
        /* 호버 효과: 마우스를 올리면 크기가 커지고 색상이 변함 */
        .box {
            width: 200px;
            height: 200px;
            background-color: #3498db;
            border-radius: 15px;
            transition: transform 0.3s, background-color 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .box:hover {
            transform: scale(1.1);
            background-color: #2980b9;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">마우스를 올려보세요!</div>
    <button onclick="changeBg()">배경색 바꾸기</button>

    <script>
        // 클릭 이벤트: 버튼을 누를 때마다 배경색 변경
        function changeBg() {
            const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#9b59b6', '#ffffff'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
