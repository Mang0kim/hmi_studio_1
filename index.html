<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인터랙션 페이지</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.3s;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="counter">0</h1>
        <button onclick="increase()">증가</button>
        <button onclick="reset()">리셋</button>
        <button onclick="toggleTheme()">테마 변경</button>
    </div>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter');

        function increase() {
            count++;
            counterElement.innerText = count;
        }

        function reset() {
            count = 0;
            counterElement.innerText = count;
        }

        function toggleTheme() {
            const body = document.body;
            const currentBg = body.style.backgroundColor;
            body.style.backgroundColor = currentBg === 'rgb(51, 51, 51)' ? '#fff' : '#333';
            body.style.color = currentBg === 'rgb(51, 51, 51)' ? '#000' : '#fff';
        }
    </script>

</body>
</html>
